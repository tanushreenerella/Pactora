databases:
  - name: pactora-db
    plan: free
    databaseName: pactora
    user: pactora

services:
  - type: web
    name: pactora-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_BASE_URL
        value: https://api-m.sandbox.paypal.com
      - key: OPENAI_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: pactora-db
          property: connectionString
      # Set to the frontend's URL, e.g. https://pactora-frontend.onrender.com
      - key: CORS_ORIGINS
        sync: false

  - type: web
    name: pactora-frontend
    runtime: node
    rootDir: frontend
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      # Set to the backend's URL, e.g. https://pactora-backend.onrender.com
      - key: NEXT_PUBLIC_API_URL
        sync: false
